<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NPC Girls</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="https://i.imgur.com/0Z8v7fL.png" type="image/png">
</head>
<body>
  <div class="container">
    <header>
      <div class="nav">
        <div class="logo">👧</div>
        <span class="brand">NPC Girls</span>
        <button class="menu">☰</button>
      </div>
    </header>

    <main>
      <h1>Look at them.<br>They're right here.</h1>
      <p class="supply">TOTAL SUPPLY <span>10,000</span></p>

      <div class="character-frame">
        <img src="https://i.imgur.com/0Z8v7fL.png" alt="NPC Girl" id="main-character">
      </div>

      <div class="controls">
        <button onclick="randomCharacter()">🔀 random</button>
        <button onclick="downloadCharacter()">⬇️ download</button>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
